# Local development database only. In Azure the app uses
# Azure Database for PostgreSQL Flexible Server (see infra/).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather_app
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_app -d weather"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
