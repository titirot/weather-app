name: Weather application CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  BICEP_VERSION: v0.48.1
  AZURE_CORE_OUTPUT: none
  AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
  AZURE_CORE_COLLECT_TELEMETRY: 'false'

jobs:
  ci:
    name: Tests, Bicep validation and release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-sha256: ${{ steps.package.outputs.sha256 }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: weather_test
          POSTGRES_USER: weather_ci
          # Disposable CI database credential, NOT a production credential.
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_ci -d weather_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and real PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://weather_ci:ci-only-disposable-password@127.0.0.1:5432/weather_test?connect_timeout=5
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --check static/app.js

      - name: Install the pinned Bicep compiler
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          "$HOME/.azure/bin/bicep" --version

      - name: Compile Bicep, validate parameters and run ARM contract tests
        shell: pwsh
        run: |
          ./infra/validate.ps1 -BicepCommand "$HOME/.azure/bin/bicep" -PythonCommand python

      - name: Lint GitHub Actions workflow
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" --output "$lint_dir/$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/actionlint_${version}_checksums.txt" --output "$lint_dir/checksums.txt"
          (cd "$lint_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$lint_dir/$archive" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -config-file .github/actionlint.yaml \
            -shellcheck= -pyflakes= .github/workflows/deploy.yml

      - name: Build the application-only deployment ZIP
        id: package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = [Path(name) for name in ("app.py", "auth.py", "storage.py", "requirements.txt")]
          files += sorted(path for path in Path("static").rglob("*") if path.is_file())
          if any(path.is_symlink() for path in files):
              raise SystemExit("Release files must not be symbolic links.")
          with ZipFile("weather.zip", "w", compression=ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          digest = hashlib.sha256(Path("weather.zip").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY

      - name: Store the tested release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weather-${{ github.sha }}
          path: weather.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy approved production release
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: production
      url: ${{ steps.infrastructure.outputs.application-url }}
    concurrency:
      group: weather-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      DATABASE_ADMIN_GROUP_OBJECT_ID: ${{ secrets.DATABASE_ADMIN_GROUP_OBJECT_ID }}
      DATABASE_ADMIN_GROUP_NAME: ${{ secrets.DATABASE_ADMIN_GROUP_NAME }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check secrets and runner prerequisites
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d "$RUNNER_TEMP/azure-weather.XXXXXX")"
          echo "AZURE_CONFIG_DIR=$config_dir" >> "$GITHUB_ENV"
          for tool in az python3 curl sha256sum; do
            command -v "$tool" >/dev/null || { echo "::error::Missing runner tool: $tool"; exit 1; }
          done
          az postgres flexible-server microsoft-entra-admin create --help >/dev/null
          python3 - <<'PY'
          import os
          import uuid

          required = (
              "AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
              "AZURE_RESOURCE_GROUP", "ENTRA_CLIENT_ID", "ENTRA_CLIENT_SECRET",
              "OPENWEATHER_API_KEY", "DATABASE_ADMIN_GROUP_OBJECT_ID",
              "DATABASE_ADMIN_GROUP_NAME", "ALERT_EMAIL",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub production secrets: " + ", ".join(missing))
          for name in ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                       "ENTRA_CLIENT_ID", "DATABASE_ADMIN_GROUP_OBJECT_ID"):
              try:
                  uuid.UUID(os.environ[name])
              except ValueError:
                  raise SystemExit(f"{name} must be a UUID.") from None
          PY

      - name: Download the tested application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weather-${{ github.sha }}
          path: ${{ runner.temp }}/weather-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify release checksum
        env:
          EXPECTED_SHA256: ${{ needs.ci.outputs.release-sha256 }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/weather-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/weather.zip"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$release" | sha256sum --check --status

      - name: Sign in to Azure using GitHub OIDC
        id: azure-login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate against Azure and preview infrastructure changes
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam --output none
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam \
            --result-format ResourceIdOnly --no-pretty-print --output json

      - name: Deploy Azure infrastructure
        id: infrastructure
        run: |
          set -euo pipefail
          outputs="$RUNNER_TEMP/weather-outputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          az deployment group create \
            --name "weather-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam \
            --query properties.outputs --output json > "$outputs"
          python3 - "$outputs" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlparse

          outputs = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {
              "applicationUrl": "application-url",
              "entraRedirectUri": "redirect-uri",
              "webAppName": "web-app-name",
              "postgresHost": "postgres-host",
              "runtimeDatabaseRole": "runtime-database-role",
              "runtimePrincipalObjectId": "runtime-principal-object-id",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              for name, output_name in names.items():
                  value = outputs[name]["value"]
                  if not isinstance(value, str) or not value or any(c in value for c in "\r\n"):
                      raise SystemExit(f"Invalid deployment output: {name}")
                  target.write(f"{output_name}={value}\n")
          url = urlparse(outputs["applicationUrl"]["value"])
          if url.scheme != "https" or not url.hostname or not url.hostname.endswith(".azurefd.net"):
              raise SystemExit("Unexpected Front Door URL.")
          PY

      - name: Record required manual sign-in callback
        env:
          REDIRECT_URI: ${{ steps.infrastructure.outputs.redirect-uri }}
        run: |
          set -euo pipefail
          printf '### Manual sign-in acceptance required\n\nAn application owner must add this Web redirect URI to the customer sign-in app, preserving existing URIs:\n\n`%s`\n\nTest real sign-in and saved preferences before production acceptance.\n' \
            "$REDIRECT_URI" >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap PostgreSQL inside a temporary private-connected App Service
        run: |
          set -euo pipefail
          python3 infra/release.py bootstrap \
            --outputs "$RUNNER_TEMP/weather-outputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

      - name: Deploy the tested Python application using Entra authorization
        run: |
          set -euo pipefail
          python3 infra/release.py publish \
            --outputs "$RUNNER_TEMP/weather-outputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --archive "$RUNNER_TEMP/weather-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/weather.zip"

      - name: Verify the public application and origin protection
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application-url }}
          WEB_APP_NAME: ${{ steps.infrastructure.outputs.web-app-name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          base = os.environ["APPLICATION_URL"]
          for attempt in range(30):
              try:
                  with urlopen(base + "/healthz", timeout=15) as response:
                      if json.load(response) != {"status": "ok"}:
                          raise ValueError("Unexpected health response")
                  with urlopen(base + "/", timeout=15) as response:
                      if b"SkyCast" not in response.read():
                          raise ValueError("Application page not deployed")
                  with urlopen(base + "/api/me", timeout=15) as response:
                      me = json.load(response)
                      if me.get("authenticated") is not False or me.get("auth_mode") != "easyauth":
                          raise ValueError("Unsafe authentication configuration")
                  with urlopen(base + "/api/weather?city=Stockholm,SE", timeout=45) as response:
                      weather = json.load(response)
                      if weather.get("provider") != "OpenWeather" or not weather.get("forecast", {}).get("items"):
                          raise ValueError("Live weather check failed")
                  break
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  print(f"Readiness attempt {attempt + 1}/30 failed ({type(error).__name__}).")
                  if attempt == 29:
                      raise SystemExit("Application did not become ready; inspect Azure deployment diagnostics.") from None
                  time.sleep(20)
          for path in ("/api/favorites", "/api/activity"):
              try:
                  with urlopen(base + path, timeout=15):
                      raise SystemExit("Personal API unexpectedly accessible without sign-in.")
              except HTTPError as error:
                  if error.code != 401:
                      raise SystemExit("Unexpected personal API authorization response.") from None
          PY
          origin="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" --query defaultHostName --output tsv)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 "https://$origin/healthz")"
          test "$status" = 403 || { echo "::error::Direct origin must return 403."; exit 1; }
          printf '### Technical smoke checks passed; manual sign-in acceptance remains\n\nApplication: %s\n\nCommit: `%s`\n' \
            "$APPLICATION_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify privileged bootstrap cleanup and SCM lockdown
        if: always() && steps.infrastructure.outcome == 'success'
        run: |
          python3 infra/release.py cleanup \
            --outputs "$RUNNER_TEMP/weather-outputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

      - name: Clear Azure account state
        if: always() && steps.azure-login.outcome == 'success'
        run: |
          if command -v az >/dev/null; then
            az logout
            az account clear
          fi

      - name: Remove temporary release metadata
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/weather-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/weather.zip" \
            "$RUNNER_TEMP/weather-outputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
